name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y openjdk-17-jdk python3-pip build-essential git python3-dev libffi-dev libssl-dev libjpeg-dev zlib1g-dev libfreetype6-dev libpng-dev automake libtool autoconf cmake ninja-build pkg-config libncurses5-dev libncursesw5-dev
    - name: Install Buildozer
      run: |
        pip install --upgrade pip
        pip install buildozer cython==0.29.36
    - name: Build with Buildozer
      run: |
        export CFLAGS="-Wno-error"
        buildozer -v android debug
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: myapp-apk
        path: bin/*.apk
